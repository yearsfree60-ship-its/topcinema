name: ضغط فصول المانهوا

on:
  workflow_dispatch:
    inputs:
      chapter_urls:
        description: "روابط الفصول (رابط في كل سطر، 10 أو أكثر مسموح)"
        required: true
        type: string
      quality:
        description: "جودة الضغط (10-90)"
        required: false
        default: "30"
        type: string
      max_width:
        description: "العرض الأقصى بالبكسل"
        required: false
        default: "800"
        type: string
      enable_incremental_push:
        description: "دفع كل فصل فور اكتماله (أبطأ قليلًا لكل فصل بسبب commit+push، لكن لو انقطع التشغيل تبقى الفصول المكتملة محفوظة). عطّله لدفعة واحدة أسرع بالنهاية فقط — لكن انقطاع التشغيل حينها يفقد كل شيء غير مدفوع"
        required: false
        default: true
        type: boolean
      resume_existing_output:
        description: "الاستمرار على فرع output الحالي بتاريخه (آمن، يحافظ على الفصول السابقة). عطّله فقط لو تريد تصفير الأرشيف بالكامل والبدء من فرع نظيف — أسرع بجلب الفرع لكنه يمسح كل شيء سابق نهائيًا"
        required: false
        default: true
        type: boolean
      strict_domain_filter:
        description: "استبعاد أي صورة من نطاق (domain) مختلف عن الأغلبية بين صور الفصل. احذر: قد يحذف صورًا شرعية لو كان الموقع يوزّع صوره على أكثر من CDN فعليًا"
        required: false
        default: false
        type: boolean
      retry_per_chapter:
        description: "عدد محاولات فتح الصفحة بالمتصفح لكل فصل عند الفشل"
        required: false
        default: "2"
        type: string
      img_fetch_retries:
        description: "عدد محاولات تحميل بايتات كل صورة عند الفشل"
        required: false
        default: "3"
        type: string

# صلاحية الكتابة مطلوبة لدفع الصور المضغوطة لفرع output
permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    # مع الدفع التدريجي (حين يكون مفعّلًا)، الفصول المكتملة تُحفظ فور دفعها،
    # فحتى لو ضُرب هذا السقف فعليًا لا يُفقد إلا الفصل قيد المعالجة لحظتها.
    timeout-minutes: 240
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          pip install --quiet playwright pillow requests
          python -m playwright install --with-deps chromium

      # هذه الخطوة ضرورية بغضّ النظر عن تفعيل الدفع التدريجي أو لا — سواء
      # دفعنا بعد كل فصل أو دفعة واحدة بالنهاية، لازم مكان صحيح (فرع output)
      # نكتب فيه وندفع منه. resume_existing_output يتحكم فقط هل نبني على
      # تاريخ الفرع الحالي (آمن) أو نبدأ فرعًا نظيفًا (أسرع جلبًا، لكن يمسح
      # كل الفصول السابقة نهائيًا — استخدمه بحذر).
      - name: تجهيز فرع الإخراج (git worktree)
        env:
          RESUME_EXISTING_OUTPUT: ${{ inputs.resume_existing_output }}
        run: |
          set -e
          git config user.name "manhwa-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin --quiet || true

          if [ "$RESUME_EXISTING_OUTPUT" = "true" ] && git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            # الفرع output موجود مسبقًا ونريد الاستمرار عليه بتاريخه كاملًا
            git worktree add output-worktree origin/output
            git -C output-worktree checkout -B output origin/output
          else
            # فرع نظيف: إما أول تشغيلة، أو طُلب تصفير الأرشيف صراحة
            if [ "$RESUME_EXISTING_OUTPUT" != "true" ]; then
              echo "⚠️ تم اختيار البدء من فرع نظيف — سيُستبدل أي فرع output موجود بالكامل عند أول دفع"
            fi
            git worktree add --detach output-worktree
            git -C output-worktree checkout --orphan output
            git -C output-worktree rm -rf . > /dev/null 2>&1 || true
            git -C output-worktree commit --allow-empty -m "تهيئة فرع output"
          fi

          mkdir -p output-worktree/output
          echo "OUTPUT_WORKTREE=$(pwd)/output-worktree" >> "$GITHUB_ENV"

      - name: تشغيل الضغط
        env:
          CHAPTER_URLS: ${{ inputs.chapter_urls }}
          IMG_QUALITY: ${{ inputs.quality }}
          IMG_MAX_WIDTH: ${{ inputs.max_width }}
          OUTPUT_DIR: ${{ env.OUTPUT_WORKTREE }}/output
          CDN_BASE: https://raw.githubusercontent.com/${{ github.repository }}/output/output
          # الدفع التدريجي الفعلي (commit+push بعد كل فصل ناجح) يُنفَّذ الآن
          # فعليًا داخل compress_chapters.py، مربوطًا بهذا المفتاح
          ENABLE_INCREMENTAL_PUSH: ${{ inputs.enable_incremental_push }}
          GIT_COMMIT_DIR: ${{ env.OUTPUT_WORKTREE }}
          GIT_BRANCH: output
          STRICT_DOMAIN_FILTER: ${{ inputs.strict_domain_filter && '1' || '0' }}
          RETRY_PER_CHAPTER: ${{ inputs.retry_per_chapter }}
          IMG_FETCH_RETRIES: ${{ inputs.img_fetch_retries }}
        run: python compress_chapters.py

      # شبكة أمان أخيرة: تعمل حتى لو فشل السكربت أو انقطع (بلوغ سقف الوقت،
      # إلغاء يدوي، عطل عابر) قبل أن يتمكن من دفع آخر فصل. إن كان الدفع
      # التدريجي مفعّلًا، هذه الخطوة عادة لا تجد شيئًا إضافيًا لدفعه (كل شيء
      # مدفوع أصلًا فصلًا بفصل). إن كان مُعطَّلًا، هذه الخطوة هي الدفعة
      # الوحيدة لكل النتائج دفعة واحدة بالنهاية.
      - name: دفع احتياطي نهائي (شبكة أمان)
        if: always()
        run: |
          if [ -z "$OUTPUT_WORKTREE" ] || [ ! -d "$OUTPUT_WORKTREE" ]; then
            echo "لا يوجد worktree لدفعه (فشلت خطوة التجهيز على الأغلب) — تخطي"
            exit 0
          fi
          cd "$OUTPUT_WORKTREE"
          git add output || true
          if git diff --cached --quiet; then
            echo "لا تغييرات إضافية غير مدفوعة — كل شيء محفوظ أصلًا"
          else
            git commit -m "دفع احتياطي نهائي - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            success=0
            for i in 1 2 3 4 5; do
              if git push origin HEAD:output; then
                success=1
                break
              fi
              echo "فشلت محاولة الدفع #$i — إعادة محاولة بعد سحب أحدث تغييرات..."
              git fetch origin output || true
              git rebase origin/output || git rebase --abort || true
              sleep $((i * 3))
            done
            if [ "$success" -ne 1 ]; then
              echo "⚠️ تعذّر الدفع الاحتياطي النهائي بعد كل المحاولات — قد تحتاج لدفع يدوي لاحقًا"
              exit 1
            fi
          fi

      - name: رابط النتيجة
        if: always()
        run: |
          echo "=================================================="
          echo "manifest.json:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/manifest.json"
          echo "=================================================="

      - name: إجبار تحديث كاش jsDelivr فورًا
        if: always()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@output/output/manifest.json" || true
          echo "تم إرسال طلب تحديث الكاش. لو ظهرت بيانات قديمة رغم ذلك، انتظر دقيقتين وحاول ثانية."
