name: ضغط فصول المانهوا

on:
  workflow_dispatch:
    inputs:
      chapter_urls:
        description: "روابط الفصول (رابط في كل سطر، 10 أو أكثر مسموح) — كلها من نفس الموقع المختار أدناه. بوضع التشخيص: رابط أو رابطين فقط يكفي. بوضع إعادة_ترجمة: اتركه فارغًا للاكتشاف التلقائي من failed_translations.txt، أو حدّد روابط بعينها لإعادة ترجمتها قسرًا (تُستبدَل ترجمتها بالكامل حتى لو نجحت سابقًا)"
        required: true
        type: string
      mode:
        description: "الوضع — يحدّد أي الحقول بالأسفل فعليًا مؤثّرة لهذه التشغيلة (كل الحقول تبقى ظاهرة دومًا — GitHub Actions لا يدعم إخفاء حقول ديناميكيًا حسب اختيار آخر، هذا قيد المنصة نفسها لا هذا الملف؛ الحقول مُجمَّعة ومُعلَّمة بالأسفل حسب الوضع لتسهيل التصفح فقط). إنتاج = تحميل+ضغط+حفظ فعلي. تشخيص = فحص فقط بلا تحميل حقيقي. استخراج_نص = تجربة OCR (مرحلة ١). إعادة_ترجمة = إعادة ترجمة فصول مُستخرَجة مسبقًا فقط، بلا تحميل صور أو OCR إطلاقًا (أسرع بكثير). إنتاج_كامل = ضغط+OCR+ترجمة معًا لكل فصل بجلب واحد فقط لكل صورة (الترجمة تُفرَض مفعّلة دومًا بهذا الوضع بصرف النظر عن حقل translate_to_arabic)"
        required: true
        type: choice
        options:
          - إنتاج
          - تشخيص
          - استخراج_نص
          - إعادة_ترجمة
          - إنتاج_كامل
        default: إنتاج
      site:
        description: "[إنتاج + استخراج_نص] الموقع المصدر — يفعّل الأسلوب المناسب له تحديدًا بدل التخمين. لا يدعم Actions أزرارًا حقيقية؛ هذه أقرب بديل (قائمة اختيار واحد). يُتجاهَل كليًا بوضع التشخيص. like_manga_test: بروفايل تجريبي لـlike-manga.net عبر ScraperAPI (يتطلب سر SCRAPERAPI_KEY، وإلا رفض فوري واضح)، لقياس أرصدة الاستهلاك الفعلية قبل اعتماده"
        required: true
        type: choice
        options:
          - azorafly
          - mangatuk
          - mangatime
          - olympustaff
          - procomic
          - auto
          - like_manga_test
        default: auto

      # ── 🏭 الحقول التالية فعّالة بوضع "إنتاج" فقط (تُتجاهَل بالوضعين الآخرين) ──
      quality:
        description: "[إنتاج فقط] جودة الضغط (10-90)"
        required: false
        default: "30"
        type: string
      output_format:
        description: "[إنتاج فقط] صيغة الصور الناتجة — WEBP سريع الترميز وآمن افتراضيًا. AVIF أصغر حجمًا (خصوصًا للصفحات الملونة/المتدرجة) لكن ترميزه أبطأ بعشرات المرات — مع أعداد فصول كبيرة قد يقترب من مهلة الـ240 دقيقة"
        required: false
        default: webp
        type: choice
        options:
          - webp
          - avif
      max_width:
        description: "[إنتاج فقط] العرض الأقصى بالبكسل"
        required: false
        default: "800"
        type: string
      skip_existing_chapters:
        description: "[إنتاج فقط] تخطي أي فصل محفوظ مسبقًا على فرع output (بنفس المانهوا ورقم الفصل) بدل إعادة تحميله وضغطه"
        required: false
        default: true
        type: boolean
      enable_incremental_push:
        description: "[إنتاج فقط] دفع كل فصل فور اكتماله. عطّله لدفعة واحدة أسرع بالنهاية فقط — لكن انقطاع التشغيل حينها يفقد كل شيء غير مدفوع"
        required: false
        default: true
        type: boolean

      # ── ⚙️ الحقول التالية مشتركة بين "إنتاج" و"استخراج_نص" (تُتجاهَل بوضع التشخيص) ──
      http_concurrency:
        description: "[إنتاج + استخراج_نص] عدد الفصول المُعالَجة بالتوازي (بروفايل azorafly/HTTP فقط، حد أقصى 10 — بلا تأثير على البروفايلات الأخرى)"
        required: false
        default: "3"
        type: string
      strict_domain_filter:
        description: "[إنتاج + استخراج_نص] استبعاد أي صورة من نطاق مختلف عن الأغلبية بين صور الفصل"
        required: false
        default: false
        type: boolean
      retry_per_chapter:
        description: "[إنتاج + استخراج_نص] عدد محاولات جلب الفصل عند الفشل"
        required: false
        default: "2"
        type: string
      img_fetch_retries:
        description: "[إنتاج + استخراج_نص] عدد محاولات تحميل بايتات كل صورة عند الفشل"
        required: false
        default: "3"
        type: string

      # ── 📝 الحقلان التاليان فعّالان بوضع "استخراج_نص" فقط ──
      manga_title_override:
        description: "[استخراج_نص فقط] تجاوز يدوي اختياري لاسم المانهوا بتسمية أرشيف zip واسم الأرتيفاكت. اتركه فارغًا للاعتماد على التخمين التلقائي من عنوان صفحة أول فصل — لو التخمين غير مُرضٍ أو فشل، استخدم هذا الحقل"
        required: false
        default: ""
        type: string
      ocr_detection_model:
        description: "[استخراج_نص فقط] نموذج كشف النص (detection) — mobile أسرع بكثير على CPU (~60% حسب قياسات PaddleOCR الرسمية) بفرق دقة أقل من 1% للنص الإنجليزي المطبوع تحديدًا، server أدق للنصوص الفنية/المعقدة"
        required: false
        default: server
        type: choice
        options:
          - server
          - mobile
      translate_to_arabic:
        description: "[استخراج_نص فقط] ترجمة النص المستخرَج آليًا للعربية (سياقية، نداء واحد لكل فصل عبر Gemini المجاني) بجانب النص الإنجليزي — يتطلب ضبط سر GEMINI_API_KEY بإعدادات المستودع، وإلا تُعطَّل تلقائيًا بتحذير بلا أي تأثير على باقي الميزات (نص إنجليزي فقط)"
        required: false
        default: true
        type: boolean

      # ── 🔍 الحقل التالي فعّال بوضع "تشخيص" فقط ──
      deep_diagnostic:
        description: "[تشخيص فقط] يضيف مسبارين لا يقيسهما التشخيص العادي إطلاقًا: تسريب Runtime.enable (بروتوكول CDP نفسه، لا JS fingerprint) وتسريب sourceURL لسكربتات page.evaluate، مع تجميعهما وباقي طبقات الفحص القائمة بخريطة detection_surface_map موحّدة لكل رابط. يُضاعِف زمن التشخيص تقريبًا لكل رابط (~90-180ث إضافية)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ملاحظة: تثبيت Playwright/Chromium يحدث دومًا حتى لو اخترت بروفايلًا
      # لا يحتاج متصفح (أزورافلاي مثلًا) — لأن هذه خطوة ثابتة قبل معرفة
      # المدخلات وقت بناء الصورة. السكربت نفسه هو من يتخطى إطلاق المتصفح
      # فعليًا حين لا يحتاجه البروفايل (توفير وقت التشغيل الفعلي، لا التثبيت)
      # [تحسين احترافي] أُضيفت playwright-stealth (تمويه بصمة المتصفح —
      # راجع _STEALTH بالسكربت) و pillow-avif-plugin (يُستخدَم فقط لو
      # output_format=avif؛ تثبيته دومًا آمن وغير مكلف وقتًا — السكربت
      # نفسه يتحقق من IMG_FORMAT ويستورده شرطيًا وقت التشغيل فقط).
      # [جديد — المرحلة ١] paddleocr/paddlepaddle تُثبَّت دومًا (نفس منطق
      # Playwright/pillow-avif الثابت أعلاه) — السكربت نفسه يستوردها بشكل
      # كسول (lazy import) ولا يلمسها إطلاقًا لو ocr_experiment_mode معطّلًا،
      # فلا تكلفة زمن تشغيل فعلي على أي تشغيلة عادية، فقط زمن تثبيت pip.
      # [تثبيت إصدار — موثَّق] paddleocr==3.2.0 + paddlepaddle==3.1.1 مثبَّتان
      # صراحة بدل السحب المفتوح: توثيق PaddleOCR الرسمي (سجل إصدارات PyPI،
      # 3.2.0 بتاريخ 2025-08-21) يؤكد دعمًا كاملًا لـPaddlePaddle 3.1.0/3.1.1،
      # وهذا الثنائي يسبق تمامًا خلل PIR/oneDNN الذي أكّد فريق Paddle نفسه
      # (issue #77340) أنه ارتداد بدأ فقط من PaddlePaddle 3.3.0 فصاعدًا. أي
      # فتح الإصدار للأعلى مستقبلًا قد يجلب الخلل من جديد دون سبب وجيه.
      # [جديد — ترجمة سياقية EN→AR] google-genai (حزمة Gemini الرسمية
      # الحالية — راجع تبرير اختيار Gemini/gemini-3.1-flash-lite بترويسة
      # translate_to_arabic.py) تُثبَّت دومًا بنفس منطق paddleocr أعلاه: لا
      # تكلفة زمن تشغيل فعلي على أي تشغيلة لا تفعّل الترجمة (استيراد مؤجَّل
      # بالسكربت)، فقط زمن تثبيت pip إضافي بسيط.
      # [جديد — وضع إعادة_ترجمة، تسريع كامل] هذه الخطوة فقط تُثبَّت دومًا —
      # الحد الأدنى الفعلي الذي يحتاجه compress_chapters.py ليُستورَد أصلًا
      # (playwright/playwright_stealth/PIL مستوردة على مستوى الملف نفسه —
      # راجع ترويستيه، لا بديل حتى لو لم يُستخدَم المتصفح فعليًا بوضع
      # إعادة_ترجمة) + google-genai لازمة للترجمة بكل الأوضاع التي تفعّلها.
      # لا تُثبَّت متصفحات Chromium هنا (خطوة منفصلة أدناه، مشروطة) — حزمة
      # playwright نفسها خفيفة، المُكلِّف زمنًا هو تنزيل المتصفح تحديدًا.
      - name: تثبيت المكتبات (أساسي — كل الأوضاع)
        run: |
          pip install --quiet playwright playwright-stealth pillow requests google-genai

      # [جديد — وضع إعادة_ترجمة، تسريع كامل] paddleocr/paddlepaddle (ثقيلتان،
      # تثبيت دقائق) وتنزيل متصفح Chromium (دقيقة+) لا حاجة لأي منهما بوضع
      # إعادة_ترجمة إطلاقًا — لا تحميل صور ولا OCR يحدث به (راجع
      # run_retranslate_mode بـocr_extraction.py: يقرأ text_en.json من القرص
      # مباشرة فقط). pillow-avif-plugin (يُستخدَم فقط لو output_format=avif
      # بوضع الإنتاج) مُدرَجة هنا أيضًا بنفس المنطق — غير لازمة لإعادة الترجمة.
      - name: تثبيت متطلبات المتصفح وOCR (كل الأوضاع ما عدا إعادة_ترجمة)
        if: inputs.mode != 'إعادة_ترجمة'
        run: |
          pip install --quiet pillow-avif-plugin paddleocr==3.2.0 paddlepaddle==3.1.1
          python -m playwright install --with-deps chromium

      # [جديد — تفعيل DEEP_DIAGNOSTIC] patchright حزمة منفصلة تمامًا عن
      # playwright (مساحة استيراد مختلفة: patchright.async_api لا
      # playwright.async_api) — لا تعارض ولا استبدال لحزمة playwright
      # المثبَّتة أعلاه، تُستخدَم فقط داخل مسبار تسريب Runtime.enable
      # بوضع التشخيص العميق. مشروطة بـmode=تشخيص + deep_diagnostic معًا
      # كي لا تُثقل أي تشغيلة إنتاج عادية بوقت تثبيت/تنزيل Chromium إضافي
      # لا تحتاجه إطلاقًا.
      - name: تثبيت patchright (تشخيص عميق فقط)
        if: inputs.mode == 'تشخيص' && inputs.deep_diagnostic
        run: |
          pip install --quiet patchright
          patchright install chromium

      # [جديد — المرحلة ١] كاش نماذج PaddleOCR بين التشغيلات — بدونه كل
      # تشغيلة (worktree/رانر جديد من الصفر) تُعيد تحميل نماذج الكشف+التعرّف
      # من الإنترنت من جديد، وهذا وقت مهدور من مهلة الـ240 دقيقة المشتركة
      # مع الجلب والضغط. المسار قد يختلف بين إصدارات المكتبة (~/.paddlex
      # هو المسار الحالي المعروف)، فأُضيف أكثر من مسار محتمل احتياطًا.
      - name: كاش نماذج PaddleOCR
        if: inputs.mode == 'استخراج_نص' || inputs.mode == 'إنتاج_كامل'
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex
            ~/.paddleocr
            ~/.paddlehub
          key: paddleocr-models-en-v1

      # [تعديل] لم يعد هناك أي خيار لتصفير الأرشيف. التشغيلة تستأنف دومًا
      # على فرع output الحالي بتاريخه الكامل إن وُجد، وإلا تُنشئه فارغًا
      # أول مرة فقط. هذا يضمن عدم حذف أي فصل مضغوط سابقًا مهما حدث.
      - name: تجهيز فرع الإخراج (git worktree)
        run: |
          set -e
          git config user.name "manhwa-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin --quiet || true

          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            git worktree add output-worktree origin/output
            git -C output-worktree checkout -B output origin/output
          else
            git worktree add --detach output-worktree
            git -C output-worktree checkout --orphan output
            git -C output-worktree rm -rf . > /dev/null 2>&1 || true
            git -C output-worktree commit --allow-empty -m "تهيئة فرع output"
          fi

          mkdir -p output-worktree/output
          echo "OUTPUT_WORKTREE=$(pwd)/output-worktree" >> "$GITHUB_ENV"

      - name: تشغيل الضغط
        env:
          CHAPTER_URLS: ${{ inputs.chapter_urls }}
          SITE_PROFILE: ${{ inputs.site }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          IMG_QUALITY: ${{ inputs.quality }}
          IMG_MAX_WIDTH: ${{ inputs.max_width }}
          IMG_FORMAT: ${{ inputs.output_format }}
          HTTP_CONCURRENCY: ${{ inputs.http_concurrency }}
          SKIP_EXISTING_CHAPTERS: ${{ inputs.skip_existing_chapters }}
          DIAGNOSTIC_MODE: ${{ inputs.mode == 'تشخيص' }}
          OCR_EXPERIMENT_MODE: ${{ inputs.mode == 'استخراج_نص' }}
          RETRANSLATE_ONLY_MODE: ${{ inputs.mode == 'إعادة_ترجمة' }}
          FULL_PRODUCTION_MODE: ${{ inputs.mode == 'إنتاج_كامل' }}
          MANGA_TITLE_OVERRIDE: ${{ inputs.manga_title_override }}
          OCR_DETECTION_MODEL: ${{ inputs.ocr_detection_model }}
          TRANSLATE_TO_ARABIC: ${{ inputs.translate_to_arabic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEP_DIAGNOSTIC: ${{ inputs.deep_diagnostic }}
          RUN_ID: ${{ github.run_id }}
          OUTPUT_DIR: ${{ env.OUTPUT_WORKTREE }}/output
          CDN_BASE: https://raw.githubusercontent.com/${{ github.repository }}/output/output
          ENABLE_INCREMENTAL_PUSH: ${{ inputs.enable_incremental_push }}
          GIT_COMMIT_DIR: ${{ env.OUTPUT_WORKTREE }}
          GIT_BRANCH: output
          STRICT_DOMAIN_FILTER: ${{ inputs.strict_domain_filter && '1' || '0' }}
          RETRY_PER_CHAPTER: ${{ inputs.retry_per_chapter }}
          IMG_FETCH_RETRIES: ${{ inputs.img_fetch_retries }}
        # [جديد — بند 3 من خطة إصلاح تناقض PIR/OOM] حلقة إعادة تشغيل عملية
        # Python كاملة عند خروج compress_chapters.py بكود 75 تحديدًا — هذا
        # الكود مخصَّص حصرًا لوضع ocr_experiment_mode عند تجاوز OCR_MAX_RSS_MB
        # (راجع run_ocr_experiment_mode بـocr_extraction.py). أي كود خروج
        # آخر (0 نجاح، 1 فشل كامل، أو أي رمز آخر) يُخرج فورًا بنفس الكود —
        # يطابق سلوك الخطوة السابق تمامًا لكل الأوضاع الأخرى (ضغط/تشخيص)
        # التي لا تُصدر 75 إطلاقًا. "if cmd; then" (لا "cmd; code=$?") لازم
        # هنا تحديدًا لأن shell الافتراضي بأكشنز يعمل بـ"set -e" ضمنيًا —
        # التقاط $? مباشرة بعد أمر فاشل تحت set -e لن يُنفَّذ أصلًا (الصدفة
        # تُنهي السكربت فورًا عند فشل أي أمر بسيط خارج سياق شرطي)، والوضع
        # الشرطي (if) مُستثنى صراحة من هذا السلوك. لا سقف صريح لعدد
        # الإعادات (قرار صريح — راجع الخطة) — فقط timeout-minutes: 240
        # الكلي بأعلى الملف يحدّ التكرار عمليًا. remaining_urls.txt يُقرَأ
        # من نفس مسار OUTPUT_DIR (نفس worktree يبقى على قرص الرانر بين
        # استدعاءات Python المتتالية ضمن نفس خطوة الـworkflow هذه).
        run: |
          current_chapter_urls="$CHAPTER_URLS"
          attempt=1
          while true; do
            if [ "$attempt" -gt 1 ]; then
              echo "=================================================="
              echo "🔁 [بند 3] محاولة تشغيل رقم $attempt (بعد تجاوز OCR_MAX_RSS_MB بالمحاولة السابقة)"
              echo "=================================================="
            fi
            if CHAPTER_URLS="$current_chapter_urls" python compress_chapters.py; then
              exit_code=0
            else
              exit_code=$?
            fi
            if [ "$exit_code" -ne 75 ]; then
              exit "$exit_code"
            fi
            remaining_file="$OUTPUT_DIR/ocr_experiment/remaining_urls.txt"
            if [ ! -s "$remaining_file" ]; then
              echo "⚠️ [بند 3] كود خروج 75 (تجاوز RSS) لكن remaining_urls.txt فارغ أو غير موجود — توقف بدل حلقة لا نهائية"
              exit 1
            fi
            current_chapter_urls="$(cat "$remaining_file")"
            attempt=$((attempt + 1))
          done

      - name: دفع احتياطي نهائي (شبكة أمان)
        if: always()
        run: |
          if [ -z "$OUTPUT_WORKTREE" ] || [ ! -d "$OUTPUT_WORKTREE" ]; then
            echo "لا يوجد worktree لدفعه (فشلت خطوة التجهيز على الأغلب) — تخطي"
            exit 0
          fi
          cd "$OUTPUT_WORKTREE"
          # [تصحيح حرج ٤/٥] كان يُستخدم هنا "git add output" العادي، الذي
          # يشمل ضمنيًا (منذ git 2.0) رصد أي ملف "محذوف من القرص" مقارنة
          # بالفهرس ودفع حذفه فعليًا. المشكلة: بعد أي "git reset origin/..."
          # سابق (هنا أو داخل compress_chapters.py نفسه قبل هذه الخطوة)، قد
          # يحوي الفهرس/HEAD ملفات دفعتها تشغيلة GitHub Actions أخرى منفصلة
          # (runs/run-<معرّف آخر>.json، صور فصل مانهوا مختلف...) غير موجودة
          # فعليًا على قرص هذا الـworktree (كل تشغيلة worktree مستقل من
          # الصفر) — فيعتبرها git "محذوفة" ويدفع حذفها، ماحيًا بصمت نتيجة
          # تشغيلة أخرى ناجحة تمامًا. الإصلاح: "--ignore-removal" (يكافئ
          # "--no-all") يجعل git add يضيف الجديد/المعدَّل فقط ويتجاهل تمامًا
          # أي ملف غائب عن القرص — فلا يُدفَع حذف أي ملف لم تحذفه هذه
          # الخطوة فعليًا، بصرف النظر عن حالة الفهرس بعد أي reset، وبلا
          # الحاجة لتعداد مسارات هذه التشغيلة يدويًا (بعكس compress_chapters.py
          # الذي يملك بيانات كافية لبناء whitelist دقيق فاستُخدم هناك).
          git add --ignore-removal -- output || true
          if git diff --cached --quiet; then
            echo "لا تغييرات إضافية غير مدفوعة — كل شيء محفوظ أصلًا"
          else
            git commit -m "دفع احتياطي نهائي - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            success=0
            for i in 1 2 3 4 5; do
              if git push origin HEAD:output; then
                success=1
                break
              fi
              echo "فشلت محاولة الدفع #$i — إعادة محاولة بعد إعادة البناء فوق أحدث نسخة..."
              git fetch origin output || true
              # reset مختلط بدل rebase: لا يلمس ملفات القرص، فقط يُرجع مؤشر
              # الفرع لأحدث نقطة بعيدة، ثم نعيد commit فوقها مباشرة — بلا
              # أي آلية دمج نصي يمكن أن تتعارض على ملف JSON مُولَّد بالكامل
              git reset origin/output
              # نفس --ignore-removal هنا أيضًا — هذا بالضبط الموضع الذي كان
              # الخلل الأصلي يظهر فيه (إضافة كاملة فور reset).
              git add --ignore-removal -- output || true
              if ! git diff --cached --quiet; then
                git commit -m "دفع احتياطي نهائي - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
              fi
              sleep $((i * 3))
            done
            if [ "$success" -ne 1 ]; then
              echo "⚠️ تعذّر الدفع الاحتياطي النهائي بعد كل المحاولات — قد تحتاج لدفع يدوي لاحقًا"
              exit 1
            fi
          fi

      # [إضافة] compress_chapters.py/ocr_extraction.py الآن يسمّيان أرشيف
      # zip بعنوان المانهوا وأرقام الفصول (لو تخمين العنوان التلقائي نجح أو
      # عبر manga_title_override اليدوي)، لا run-<RUN_ID> ثابتًا دومًا —
      # الاسم الفعلي غير معروف مسبقًا وقت كتابة هذا الملف، فتُقرأ الخطوة هنا
      # اسم الملف الفعلي من القرص بعد اكتمال Python مباشرة. fallback تلقائي
      # لـrun-<RUN_ID> لو لم يُعثر على أي zip إطلاقًا (فشل كامل مثلًا) —
      # يطابق fallback البايثون نفسه بالضبط، فلا يظهر رابط/اسم أرتيفاكت
      # مكسور بأي حالة.
      # [إصلاح — التقاط zip تشغيلة سابقة خطأً] مجلد ocr_experiment/runs/
      # يتراكم عبر التشغيلات (لا حذف لأي zip قديم، والـworktree يسحب فرع
      # output الموجود فعليًا بكامل تاريخه). البحث السابق (`ls *.zip | head
      # -n1`، ترتيب أبجدي لا زمني) قد يلتقط zip تشغيلة مختلفة تمامًا لو
      # تراكم أكثر من ملف بالمجلد. ocr_extraction.py يُضيف الآن RUN_ID
      # الحالي دومًا كلاحقة ثابتة لاسم الملف (راجع تعليق zip_stem هناك) —
      # صيغتان ممكنتان فقط بالضبط: "run-<RUN_ID>.zip" (لا عنوان وصفي متاح)
      # أو "<عنوان وصفي>__run-<RUN_ID>.zip". البحث هنا يطابق هاتين الصيغتين
      # حصرًا (لا `*.zip` عام) — يستحيل بنيويًا التقاط ملف تشغيلة أخرى، بصرف
      # النظر عن عدد الأرشيفات المتراكمة بالمجلد.
      - name: تحديد اسم أرشيف zip الفعلي (وضع تجربة OCR)
        id: ocr_zip_name
        if: always() && inputs.mode == 'استخراج_نص'
        run: |
          run_suffix="run-${{ github.run_id }}"
          zip_path="$(ls "$OUTPUT_WORKTREE/output/ocr_experiment/runs/${run_suffix}.zip" \
                         "$OUTPUT_WORKTREE"/output/ocr_experiment/runs/*"__${run_suffix}.zip" \
                         2>/dev/null | head -n1 || true)"
          if [ -n "$zip_path" ]; then
            zip_name="$(basename "$zip_path" .zip)"
          else
            echo "⚠️ لم يُعثر على أرشيف zip يطابق هذه التشغيلة (${run_suffix}) بمجلد runs — الرجوع للتسمية الافتراضية run-${{ github.run_id }}"
            zip_name="run-${{ github.run_id }}"
          fi
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          # [إضافة — إصلاح رابط raw.githubusercontent.com للأسماء الوصفية]
          # zip_name قد يحوي مسافات/حروف غير ASCII (عنوان مانهوا عربي مثلًا،
          # كـ"سولو لفلنق - ch 0") لو نجح التخمين التلقائي للعنوان أو استُخدم
          # manga_title_override. تمرير هذا الاسم خامًا (بلا ترميز) داخل رابط
          # raw.githubusercontent.com بالخطوة التالية كان يُنتج رابطًا غير
          # صالح فعليًا: المسافة تقطع اكتشاف الرابط عند أول اقتباس تلقائي
          # بعارض لوج GitHub Actions (فتُفتح صفحة 404 صغيرة بدل الأرشيف
          # الفعلي، تبدو للمستخدم كملف zip فارغ/تالف عند حفظها وفتحها كأرشيف)،
          # وRFC 3986 أصلًا يشترط ترميز المسافة والحروف غير ASCII بمسار أي
          # URL. الحل: مخرَج إضافي zip_name_encoded مُرمَّز بـurllib.parse.quote
          # (متوفرة دومًا — python3 مثبَّت افتراضيًا على رانرات GitHub
          # المستضافة، لا حاجة لانتظار خطوة تثبيت الحزم اللاحقة)، يُستخدَم
          # حصرًا داخل الرابط. الاسم الخام zip_name أعلاه يبقى كما هو ويُستخدَم
          # للمسار المحلي على القرص واسم الـartifact نفسه (لا يمر عبر متصفح
          # كرابط، فلا حاجة لترميزه هناك — واختبار فعلي أكّد أن الـartifact
          # يعمل صحيحًا بالاسم الوصفي غير المُرمَّز).
          zip_name_encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$zip_name")"
          echo "zip_name_encoded=$zip_name_encoded" >> "$GITHUB_OUTPUT"

      # [تعديل] الآن يطبع رابطين: الأرشيف الكامل (كل الفصول المضغوطة تاريخيًا،
      # لم يُلمَس) + رابط manifest مستقل خاص فقط بفصول هذه التشغيلة تحديدًا
      # (output/runs/run-<RUN_ID>.json) — بلا أي حذف أو تصفير للأرشيف الرئيسي.
      - name: رابط نتائج تجربة OCR
        if: always() && inputs.mode == 'استخراج_نص'
        run: |
          echo "=================================================="
          echo "📦 أرشيف zip خاص بهذه التشغيلة (نص+JSON لكل فصل) — رابط تنزيل مباشر بلا تسجيل دخول:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/ocr_experiment/runs/${{ steps.ocr_zip_name.outputs.zip_name_encoded }}.zip"
          echo ""
          echo "أو حمّل أرتيفاكت '${{ steps.ocr_zip_name.outputs.zip_name }}' من صفحة هذه التشغيلة أعلاه (نسخة احتياطية)"
          echo "=================================================="

      - name: رفع نتائج تجربة OCR كأرتيفاكت
        if: always() && inputs.mode == 'استخراج_نص'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ocr_zip_name.outputs.zip_name }}
          path: ${{ env.OUTPUT_WORKTREE }}/output/ocr_experiment
          if-no-files-found: warn
          retention-days: 14

      # [جديد — وضع الإنتاج_الكامل] نفس منطق تحديد اسم zip الفعلي حرفيًا
      # (راجع تعليق الخطوة المطابقة بوضع استخراج_نص للتبرير الكامل)، لأرشيف
      # واحد فقط بهذا الوضع (run_full_production_mode بـocr_extraction.py):
      # "ocr-" بمجلد ocr_experiment/runs/ لملفات OCR+الترجمة حصرًا. لا أرشيف
      # منفصل للصور المضغوطة — [قرار — إزالة تكرار] الصور مخدومة أصلًا فرديًا
      # عبر manifest.json+CDN (raw.githubusercontent/jsDelivr، رابط أدناه)
      # بنفس آلية وضع «إنتاج» العادي تمامًا؛ أرشيف صور إضافي كان يعني قراءة
      # كل صورة من القرص مجددًا وإعادة ضغطها بـzip (وقت CPU إضافي حقيقي لكل
      # تشغيلة) ومضاعفة حجم بايتات الصور المخزَّنة بفرع git — بلا فائدة
      # مطابقة لفائدة أرشيف OCR/الترجمة (الذي لا آلية توزيع أخرى له إطلاقًا،
      # فقيمته الإضافية حقيقية لا تكرار).
      - name: تحديد اسم أرشيف zip الفعلي (وضع الإنتاج الكامل)
        id: full_production_zip_names
        if: always() && inputs.mode == 'إنتاج_كامل'
        run: |
          run_suffix="run-${{ github.run_id }}"

          ocr_zip_path="$(ls "$OUTPUT_WORKTREE/output/ocr_experiment/runs/ocr-${run_suffix}.zip" \
                             "$OUTPUT_WORKTREE"/output/ocr_experiment/runs/ocr-*"__${run_suffix}.zip" \
                             2>/dev/null | head -n1 || true)"
          if [ -n "$ocr_zip_path" ]; then
            ocr_zip_name="$(basename "$ocr_zip_path" .zip)"
          else
            echo "⚠️ لم يُعثر على أرشيف OCR/ترجمة يطابق هذه التشغيلة (${run_suffix}) بمجلد ocr_experiment/runs"
            ocr_zip_name="ocr-${run_suffix}"
          fi
          echo "ocr_zip_name=$ocr_zip_name" >> "$GITHUB_OUTPUT"
          ocr_zip_name_encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$ocr_zip_name")"
          echo "ocr_zip_name_encoded=$ocr_zip_name_encoded" >> "$GITHUB_OUTPUT"

      - name: رابط نتيجة الإنتاج الكامل
        if: always() && inputs.mode == 'إنتاج_كامل'
        run: |
          echo "=================================================="
          echo "الصور المضغوطة مخدومة فرديًا عبر manifest.json (بنفس آلية وضع «إنتاج» تمامًا، لا أرشيف zip منفصل):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/manifest.json"
          echo ""
          echo "📦 أرشيف OCR+الترجمة الخاص بهذه التشغيلة حصرًا — رابط تنزيل مباشر بلا تسجيل دخول:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/ocr_experiment/runs/${{ steps.full_production_zip_names.outputs.ocr_zip_name_encoded }}.zip"
          echo ""
          echo "أو حمّل أرتيفاكت '${{ steps.full_production_zip_names.outputs.ocr_zip_name }}' من صفحة هذه التشغيلة أعلاه (نسخة احتياطية)"
          echo "=================================================="

      - name: رفع أرشيف OCR+الترجمة كأرتيفاكت (الإنتاج الكامل)
        if: always() && inputs.mode == 'إنتاج_كامل'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.full_production_zip_names.outputs.ocr_zip_name }}
          path: ${{ env.OUTPUT_WORKTREE }}/output/ocr_experiment
          if-no-files-found: warn
          retention-days: 14

      - name: رابط النتيجة
        if: always() && inputs.mode == 'إنتاج'
        run: |
          echo "=================================================="
          echo "manifest.json الكامل (كل الفصول المضغوطة سابقًا وحاليًا، لم يُحذف منه شيء):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/manifest.json"
          echo ""
          echo "manifest خاص بهذه التشغيلة فقط (فصول تم العمل عليها الآن حصرًا):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/runs/run-${{ github.run_id }}.json"
          echo "=================================================="

      # [جديد — رابط خاص بهذه التشغيلة، بنفس نمط وضع تجربة OCR حرفيًا] راجع
      # التبرير الكامل (بادئة retranslate-، RUN_ID كلاحقة ثابتة تمنع تصادم
      # الاسم عبر تشغيلات متراكمة بنفس المجلد) بترويسة بناء zip داخل
      # run_retranslate_mode بـocr_extraction.py.
      - name: تحديد اسم أرشيف zip الفعلي (وضع إعادة الترجمة)
        id: retranslate_zip_name
        if: always() && inputs.mode == 'إعادة_ترجمة'
        run: |
          run_suffix="retranslate-run-${{ github.run_id }}"
          zip_path="$(ls "$OUTPUT_WORKTREE/output/ocr_experiment/runs/${run_suffix}.zip" \
                         "$OUTPUT_WORKTREE"/output/ocr_experiment/runs/retranslate-*"__run-${{ github.run_id }}.zip" \
                         2>/dev/null | head -n1 || true)"
          if [ -n "$zip_path" ]; then
            zip_name="$(basename "$zip_path" .zip)"
            found=1
          else
            echo "⚠️ لم يُعثر على أرشيف zip يطابق هذه التشغيلة (لا فصول تُرجمت فعليًا بها على الأغلب — راجع لوج خطوة \"تشغيل الضغط\" أعلاه)"
            zip_name="$run_suffix"
            found=0
          fi
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          zip_name_encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$zip_name")"
          echo "zip_name_encoded=$zip_name_encoded" >> "$GITHUB_OUTPUT"

      - name: رابط نتائج إعادة الترجمة
        if: always() && inputs.mode == 'إعادة_ترجمة' && steps.retranslate_zip_name.outputs.found == '1'
        run: |
          echo "=================================================="
          echo "📦 أرشيف zip خاص بهذه التشغيلة فقط (الترجمات + failed_translations.txt الحالي) — رابط تنزيل مباشر بلا تسجيل دخول:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/ocr_experiment/runs/${{ steps.retranslate_zip_name.outputs.zip_name_encoded }}.zip"
          echo ""
          echo "أو حمّل أرتيفاكت '${{ steps.retranslate_zip_name.outputs.zip_name }}' من صفحة هذه التشغيلة أعلاه (نسخة احتياطية)"
          echo "=================================================="

      - name: رفع نتائج إعادة الترجمة كأرتيفاكت
        if: always() && inputs.mode == 'إعادة_ترجمة' && steps.retranslate_zip_name.outputs.found == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.retranslate_zip_name.outputs.zip_name }}
          path: ${{ env.OUTPUT_WORKTREE }}/output/ocr_experiment/runs/${{ steps.retranslate_zip_name.outputs.zip_name }}.zip
          if-no-files-found: warn
          retention-days: 14

      - name: ملخّص إعادة الترجمة (لا فصول تُرجمت فعليًا)
        if: always() && inputs.mode == 'إعادة_ترجمة' && steps.retranslate_zip_name.outputs.found != '1'
        run: |
          echo "=================================================="
          echo "لم يُنتَج أرشيف خاص بهذه التشغيلة (لم يُترجَم أي فصل فعليًا بها — إما لا شيء لإعادة ترجمته، أو فشلت كل المحاولات). راجع لوج خطوة \"تشغيل الضغط\" أعلاه للتفاصيل، وملف failed_translations.txt الحالي إن وُجد:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/ocr_experiment/failed_translations.txt"
          echo "=================================================="

      - name: رابط تقارير التشخيص
        if: always() && inputs.mode == 'تشخيص'
        run: |
          echo "=================================================="
          echo "ملخص التشخيص (على فرع output إن كان الدفع متاحًا):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/diagnostics/summary.json"
          echo ""
          echo "📦 أرشيف zip خاص بهذه التشغيلة فقط (تقارير + لقطات الشاشة معًا) —"
          echo "رابط تنزيل مباشر بلا تسجيل دخول، يعمل بموثوقية على أندرويد:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/diagnostics/runs/run-${{ github.run_id }}.zip"
          echo ""
          echo "أو حمّل أرتيفاكت 'diagnostics-${{ github.run_id }}' من صفحة هذه التشغيلة أعلاه (نسخة احتياطية، يتطلب تسجيل دخول لـGitHub وقد لا ينزّل بسلاسة على الجوال)"
          echo "=================================================="

      # رفع مجلد التشخيص (JSON + لقطات شاشة) كأرتيفاكت مستقل لهذه التشغيلة —
      # الكود نفسه يطبع رسالة تَعِد بهذا؛ بدون هذه الخطوة كانت الرسالة غير
      # صحيحة لأن شيئًا لم يكن يُرفَع فعليًا. يعمل فقط إن كان mode=تشخيص
      # (المجلد لن يوجد أصلًا في التشغيل العادي)؛ if-no-files-found يمنع
      # فشل الخطوة لو لم يوجد المجلد.
      - name: رفع تقارير التشخيص كأرتيفاكت
        if: always() && inputs.mode == 'تشخيص'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: ${{ env.OUTPUT_WORKTREE }}/output/diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: إجبار تحديث كاش jsDelivr فورًا
        if: always() && inputs.mode == 'إنتاج'
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@output/output/manifest.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@output/output/runs/run-${{ github.run_id }}.json" || true
          echo "تم إرسال طلب تحديث الكاش. لو ظهرت بيانات قديمة رغم ذلك، انتظر دقيقتين وحاول ثانية."
