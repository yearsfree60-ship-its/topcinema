name: ضغط فصول المانهوا

on:
  workflow_dispatch:
    inputs:
      chapter_urls:
        description: "روابط الفصول (رابط في كل سطر، 10 أو أكثر مسموح)"
        required: true
        type: string
      quality:
        description: "جودة الضغط (10-90)"
        required: false
        default: "25"
        type: string
      max_width:
        description: "العرض الأقصى بالبكسل"
        required: false
        default: "700"
        type: string

# صلاحية الكتابة مطلوبة لدفع الصور المضغوطة لفرع output
permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          pip install --quiet playwright pillow requests
          # [مُعدَّل] نُثبّت Chrome الحقيقي إضافة لـChromium — السكربت يحاول
          # channel="chrome" أولًا لأن بصمته أقرب لمتصفح مستخدم حقيقي أمام
          # فحوصات Cloudflare، ثم يسقط تلقائيًا لـChromium لو تعذّر ذلك.
          python -m playwright install --with-deps chromium
          python -m playwright install --with-deps chrome

      - name: استرجاع كوكيز الجلسة المحفوظة (إن وُجدت)
        uses: actions/cache@v4
        with:
          path: .storage_state
          # مفتاح ثابت (بدون تاريخ) لكي تُسترجع نفس الكوكيز عبر التشغيلات
          # المتتالية أيضًا لا فقط داخل نفس التشغيلة — كوكيز cf_clearance
          # المُربحة اليوم قد تبقى صالحة للتشغيلة القادمة وتوفّر تحدي Cloudflare
          key: cf-storage-state-v1
          restore-keys: |
            cf-storage-state-

      - name: تشغيل الضغط
        env:
          CHAPTER_URLS: ${{ inputs.chapter_urls }}
          IMG_QUALITY: ${{ inputs.quality }}
          IMG_MAX_WIDTH: ${{ inputs.max_width }}
          OUTPUT_DIR: output
          CDN_BASE: https://raw.githubusercontent.com/${{ github.repository }}/output/output
        run: python compress_chapters.py

      - name: نشر النتائج على فرع output
        run: |
          set -e
          git config user.name "manhwa-bot"
          git config user.email "bot@users.noreply.github.com"

          # نحفظ مجلد الإخراج الجديد خارج شجرة git مؤقتًا قبل تبديل الفروع
          mv output /tmp/output-new

          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            # الفرع output موجود مسبقًا: نجيبه بتاريخه كاملًا حتى تتراكم الفصول القديمة
            git fetch origin output
            git checkout output
          else
            # أول تشغيلة: ننشئ الفرع من الصفر بدون تاريخ main
            git checkout --orphan output
            git rm -rf . > /dev/null 2>&1 || true
          fi

          # ندمج الفصول الجديدة فوق الموجودة (لا يحذف فصول سابقة، فقط يضيف/يحدّث)
          mkdir -p output
          cp -r /tmp/output-new/. output/

          git add output
          git commit -m "تحديث الفصول المضغوطة - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "لا تغييرات جديدة"
          git push origin output

      - name: رابط النتيجة
        run: |
          echo "=================================================="
          echo "manifest.json:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/manifest.json"
          echo "=================================================="

      - name: إجبار تحديث كاش jsDelivr فورًا
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@output/output/manifest.json" || true
          echo "تم إرسال طلب تحديث الكاش. لو ظهرت بيانات قديمة رغم ذلك، انتظر دقيقتين وحاول ثانية."
