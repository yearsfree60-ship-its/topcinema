name: ضغط فصول المانهوا

on:
  workflow_dispatch:
    inputs:
      chapter_urls:
        description: "روابط الفصول (رابط في كل سطر، 10 أو أكثر مسموح) — كلها من نفس الموقع المختار أدناه. بوضع التشخيص: رابط أو رابطين فقط يكفي (كل رابط يشغّل 5 مراحل فحص كاملة)"
        required: true
        type: string
      site:
        description: "الموقع المصدر — يفعّل الأسلوب المناسب له تحديدًا بدل التخمين. لا يدعم Actions أزرارًا حقيقية؛ هذه أقرب بديل (قائمة اختيار واحد). يُتجاهَل كليًا لو diagnostic_mode مفعّلًا"
        required: true
        type: choice
        options:
          - azorafly
          - mangatuk
          - mangatime
          - olympustaff
          - auto
        default: auto
      quality:
        description: "جودة الضغط (10-90)"
        required: false
        default: "30"
        type: string
      max_width:
        description: "العرض الأقصى بالبكسل"
        required: false
        default: "800"
        type: string
      http_concurrency:
        description: "عدد الفصول المُعالَجة بالتوازي (بروفايل azorafly/HTTP فقط، حد أقصى 10 — بلا تأثير على البروفايلات الأخرى)"
        required: false
        default: "3"
        type: string
      skip_existing_chapters:
        description: "تخطي أي فصل محفوظ مسبقًا على فرع output (بنفس المانهوا ورقم الفصل) بدل إعادة تحميله وضغطه"
        required: false
        default: true
        type: boolean
      diagnostic_mode:
        description: "وضع التشخيص: لا يُنزَّل/يُضغط أي فصل فعليًا. يفحص روابط chapter_urls بخمس مراحل (HTTP خام، متصفح كامل، حماية سرقة، تصنيف مزوّد الحماية، تحديد المعدل) وينتج توصية بروفايل جاهزة للصق + تقرير JSON + لقطة شاشة لكل رابط. يتجاهل اختيار الموقع أعلاه كليًا"
        required: false
        default: false
        type: boolean
      enable_incremental_push:
        description: "دفع كل فصل فور اكتماله. عطّله لدفعة واحدة أسرع بالنهاية فقط — لكن انقطاع التشغيل حينها يفقد كل شيء غير مدفوع"
        required: false
        default: true
        type: boolean
      strict_domain_filter:
        description: "استبعاد أي صورة من نطاق مختلف عن الأغلبية بين صور الفصل"
        required: false
        default: false
        type: boolean
      retry_per_chapter:
        description: "عدد محاولات جلب الفصل عند الفشل"
        required: false
        default: "2"
        type: string
      img_fetch_retries:
        description: "عدد محاولات تحميل بايتات كل صورة عند الفشل"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ملاحظة: تثبيت Playwright/Chromium يحدث دومًا حتى لو اخترت بروفايلًا
      # لا يحتاج متصفح (أزورافلاي مثلًا) — لأن هذه خطوة ثابتة قبل معرفة
      # المدخلات وقت بناء الصورة. السكربت نفسه هو من يتخطى إطلاق المتصفح
      # فعليًا حين لا يحتاجه البروفايل (توفير وقت التشغيل الفعلي، لا التثبيت)
      - name: تثبيت المكتبات
        run: |
          pip install --quiet playwright pillow requests
          python -m playwright install --with-deps chromium

      # [تعديل] لم يعد هناك أي خيار لتصفير الأرشيف. التشغيلة تستأنف دومًا
      # على فرع output الحالي بتاريخه الكامل إن وُجد، وإلا تُنشئه فارغًا
      # أول مرة فقط. هذا يضمن عدم حذف أي فصل مضغوط سابقًا مهما حدث.
      - name: تجهيز فرع الإخراج (git worktree)
        run: |
          set -e
          git config user.name "manhwa-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin --quiet || true

          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            git worktree add output-worktree origin/output
            git -C output-worktree checkout -B output origin/output
          else
            git worktree add --detach output-worktree
            git -C output-worktree checkout --orphan output
            git -C output-worktree rm -rf . > /dev/null 2>&1 || true
            git -C output-worktree commit --allow-empty -m "تهيئة فرع output"
          fi

          mkdir -p output-worktree/output
          echo "OUTPUT_WORKTREE=$(pwd)/output-worktree" >> "$GITHUB_ENV"

      - name: تشغيل الضغط
        env:
          CHAPTER_URLS: ${{ inputs.chapter_urls }}
          SITE_PROFILE: ${{ inputs.site }}
          IMG_QUALITY: ${{ inputs.quality }}
          IMG_MAX_WIDTH: ${{ inputs.max_width }}
          HTTP_CONCURRENCY: ${{ inputs.http_concurrency }}
          SKIP_EXISTING_CHAPTERS: ${{ inputs.skip_existing_chapters }}
          DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode }}
          RUN_ID: ${{ github.run_id }}
          OUTPUT_DIR: ${{ env.OUTPUT_WORKTREE }}/output
          CDN_BASE: https://raw.githubusercontent.com/${{ github.repository }}/output/output
          ENABLE_INCREMENTAL_PUSH: ${{ inputs.enable_incremental_push }}
          GIT_COMMIT_DIR: ${{ env.OUTPUT_WORKTREE }}
          GIT_BRANCH: output
          STRICT_DOMAIN_FILTER: ${{ inputs.strict_domain_filter && '1' || '0' }}
          RETRY_PER_CHAPTER: ${{ inputs.retry_per_chapter }}
          IMG_FETCH_RETRIES: ${{ inputs.img_fetch_retries }}
        run: python compress_chapters.py

      - name: دفع احتياطي نهائي (شبكة أمان)
        if: always()
        run: |
          if [ -z "$OUTPUT_WORKTREE" ] || [ ! -d "$OUTPUT_WORKTREE" ]; then
            echo "لا يوجد worktree لدفعه (فشلت خطوة التجهيز على الأغلب) — تخطي"
            exit 0
          fi
          cd "$OUTPUT_WORKTREE"
          git add output || true
          if git diff --cached --quiet; then
            echo "لا تغييرات إضافية غير مدفوعة — كل شيء محفوظ أصلًا"
          else
            git commit -m "دفع احتياطي نهائي - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            success=0
            for i in 1 2 3 4 5; do
              if git push origin HEAD:output; then
                success=1
                break
              fi
              echo "فشلت محاولة الدفع #$i — إعادة محاولة بعد إعادة البناء فوق أحدث نسخة..."
              git fetch origin output || true
              # reset مختلط بدل rebase: لا يلمس ملفات القرص، فقط يُرجع مؤشر
              # الفرع لأحدث نقطة بعيدة، ثم نعيد commit فوقها مباشرة — بلا
              # أي آلية دمج نصي يمكن أن تتعارض على ملف JSON مُولَّد بالكامل
              git reset origin/output
              git add output || true
              if ! git diff --cached --quiet; then
                git commit -m "دفع احتياطي نهائي - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
              fi
              sleep $((i * 3))
            done
            if [ "$success" -ne 1 ]; then
              echo "⚠️ تعذّر الدفع الاحتياطي النهائي بعد كل المحاولات — قد تحتاج لدفع يدوي لاحقًا"
              exit 1
            fi
          fi

      # [تعديل] الآن يطبع رابطين: الأرشيف الكامل (كل الفصول المضغوطة تاريخيًا،
      # لم يُلمَس) + رابط manifest مستقل خاص فقط بفصول هذه التشغيلة تحديدًا
      # (output/runs/run-<RUN_ID>.json) — بلا أي حذف أو تصفير للأرشيف الرئيسي.
      - name: رابط النتيجة
        if: always() && !inputs.diagnostic_mode
        run: |
          echo "=================================================="
          echo "manifest.json الكامل (كل الفصول المضغوطة سابقًا وحاليًا، لم يُحذف منه شيء):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/manifest.json"
          echo ""
          echo "manifest خاص بهذه التشغيلة فقط (فصول تم العمل عليها الآن حصرًا):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/runs/run-${{ github.run_id }}.json"
          echo "=================================================="

      - name: رابط تقارير التشخيص
        if: always() && inputs.diagnostic_mode
        run: |
          echo "=================================================="
          echo "ملخص التشخيص (على فرع output إن كان الدفع متاحًا):"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/output/output/diagnostics/summary.json"
          echo "أو حمّل أرتيفاكت 'diagnostics-${{ github.run_id }}' من صفحة هذه التشغيلة أعلاه (يضم لقطات الشاشة أيضًا)"
          echo "=================================================="

      # رفع مجلد التشخيص (JSON + لقطات شاشة) كأرتيفاكت مستقل لهذه التشغيلة —
      # الكود نفسه يطبع رسالة تَعِد بهذا؛ بدون هذه الخطوة كانت الرسالة غير
      # صحيحة لأن شيئًا لم يكن يُرفَع فعليًا. يعمل فقط إن كان diagnostic_mode
      # مفعّلًا (المجلد لن يوجد أصلًا في التشغيل العادي)؛ if-no-files-found
      # يمنع فشل الخطوة لو لم يوجد المجلد.
      - name: رفع تقارير التشخيص كأرتيفاكت
        if: always() && inputs.diagnostic_mode
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}
          path: ${{ env.OUTPUT_WORKTREE }}/output/diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: إجبار تحديث كاش jsDelivr فورًا
        if: always() && !inputs.diagnostic_mode
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@output/output/manifest.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@output/output/runs/run-${{ github.run_id }}.json" || true
          echo "تم إرسال طلب تحديث الكاش. لو ظهرت بيانات قديمة رغم ذلك، انتظر دقيقتين وحاول ثانية."
