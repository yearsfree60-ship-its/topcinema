name: ضغط فصول المانهوا

on:
  workflow_dispatch:
    inputs:
      chapter_urls:
        description: "روابط الفصول (رابط في كل سطر، 10 أو أكثر مسموح)"
        required: true
        type: string
      quality:
        description: "جودة الضغط (10-90)"
        required: false
        default: "25"
        type: string
      max_width:
        description: "العرض الأقصى بالبكسل"
        required: false
        default: "700"
        type: string

# صلاحية الكتابة مطلوبة لدفع الصور المضغوطة لفرع output
permissions:
  contents: write

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت المكتبات
        run: |
          pip install --quiet playwright pillow requests
          python -m playwright install --with-deps chromium

      - name: تشغيل الضغط
        env:
          CHAPTER_URLS: ${{ inputs.chapter_urls }}
          IMG_QUALITY: ${{ inputs.quality }}
          IMG_MAX_WIDTH: ${{ inputs.max_width }}
          OUTPUT_DIR: output
          CDN_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@output/output
        run: python compress_chapters.py

      - name: نشر النتائج على فرع output
        run: |
          set -e
          git config user.name "manhwa-bot"
          git config user.email "bot@users.noreply.github.com"

          # نحفظ مجلد الإخراج الجديد خارج شجرة git مؤقتًا قبل تبديل الفروع
          mv output /tmp/output-new

          if git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            # الفرع output موجود مسبقًا: نجيبه بتاريخه كاملًا حتى تتراكم الفصول القديمة
            git fetch origin output
            git checkout output
          else
            # أول تشغيلة: ننشئ الفرع من الصفر بدون تاريخ main
            git checkout --orphan output
            git rm -rf . > /dev/null 2>&1 || true
          fi

          # ندمج الفصول الجديدة فوق الموجودة (لا يحذف فصول سابقة، فقط يضيف/يحدّث)
          mkdir -p output
          cp -r /tmp/output-new/. output/

          git add output
          git commit -m "تحديث الفصول المضغوطة - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "لا تغييرات جديدة"
          git push origin output

      - name: رابط النتيجة
        run: |
          echo "=================================================="
          echo "manifest.json:"
          echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@output/output/manifest.json"
          echo "=================================================="
          echo "قد يحتاج جسدليفر بضع دقائق ليعكس أحدث نسخة (كاش)."

      - name: تثبيت المكتبات
        run: |
          pip install --quiet playwright pillow requests
          python -m playwright install --with-deps chromium

      - name: تشغيل الضغط
        env:
          CHAPTER_URLS: ${{ inputs.chapter_urls }}
          IMG_QUALITY: ${{ inputs.quality }}
          IMG_MAX_WIDTH: ${{ inputs.max_width }}
          OUTPUT_DIR: output
          CDN_BASE: https://cdn.jsdelivr.net/gh/${{ github.repository }}@output/output
        run: python compress_chapters.py

      - name: نشر النتائج على فرع output
        run: |
          git config user.name "manhwa-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan output-tmp
          git rm -rf . > /dev/null 2>&1 || true
          git checkout main -- output 2>/dev/null || true
          # في حال الفرع output موجود مسبقًا، ندمج الملفات الجديدة معه بدل استبداله بالكامل
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git fetch origin output
            git checkout output -- . 2>/dev/null || true
          fi
          git checkout main -- output
          git add output
          git commit -m "تحديث الفصول المضغوطة - $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "لا تغييرات"
          git branch -M output-tmp output
          git push origin output --force

      - name: رابط النتيجة
        run: |
          echo "=================================================="
          echo "manifest.json:"
          echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@output/output/manifest.json"
          echo "=================================================="
          echo "قد يحتاج جسدليفر بضع دقائق ليعكس أحدث نسخة (كاش)."
