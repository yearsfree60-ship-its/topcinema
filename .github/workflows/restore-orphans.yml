name: استعادة الفصول اليتيمة إلى manifest.json

# يعيد إلى output/manifest.json كل مجلد فصل موجود فعليًا بفرع output وغير مذكور به
# (يظهر بعدها بشجرتَي الاستيراد والحذف بالتطبيق)، ويملأ الحقل "num" المفقود بفصول
# الـmanifest القديمة — بدونه لا يطابق delete_manager.py تلك الفصول (يقارن str(num))
# فلا تُحذف من الـmanifest ولا تُحسب مساراتها.
# الفصول المستعادة: label/num/chNum من اسم المجلد، images = ملفات .webp مرتّبة برقم الصفحة،
# وsourceUrl فارغ (غير معروف). لا يمسّ أي ملف غير manifest.json.
# dry_run=true (الافتراضي): يطبع ما كان سيفعله بملخّص التشغيلة دون أي كتابة أو دفع.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "تجربة بلا كتابة (true) أو تنفيذ فعلي ودفع (false)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: manifest-write-output
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      GIT_BRANCH: output
    steps:
      - name: جلب خفيف لفرع output (شجرة الملفات + manifest.json فقط)
        uses: actions/checkout@v4
        with:
          ref: output
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: output/manifest.json
          sparse-checkout-cone-mode: false

      - name: كتابة سكربت الاستعادة
        run: |
          cat > "$RUNNER_TEMP/restore.py" <<'PY'
          import json, os, re, subprocess, sys
          from collections import defaultdict
          from urllib.parse import unquote

          REPO = os.environ["GITHUB_REPOSITORY"]
          DRY = os.environ.get("DRY_RUN", "true").strip().lower() == "true"
          CDN_BASE = f"https://raw.githubusercontent.com/{REPO}/output/output"
          MANIFEST = "output/manifest.json"

          if not os.path.isfile(MANIFEST):
              print("❌ output/manifest.json غير موجود — لا شيء يُستعاد إليه")
              sys.exit(1)
          with open(MANIFEST, encoding="utf-8") as f:
              manifest = json.load(f)
          manga = manifest.setdefault("manga", {})

          raw = subprocess.run(
              ["git", "ls-tree", "-r", "-z", "--name-only", "HEAD", "--", "output/"],
              capture_output=True, check=True).stdout
          paths = [p for p in raw.decode("utf-8", "surrogateescape").split("\0") if p]

          disk_dirs = set()
          webp = defaultdict(list)
          for p in paths:
              parts = p.split("/")
              if len(parts) >= 4 and parts[2].startswith("ch-"):
                  key = parts[1] + "/" + parts[2]
                  disk_dirs.add(key)
                  if len(parts) == 4 and parts[3].lower().endswith(".webp"):
                      webp[key].append(parts[3])

          def folder_of(url):
              m = re.search(r"(?:/output/output/|@output/output/)(.+)$", url)
              rel = unquote(m.group(1) if m else url)
              return rel.rsplit("/", 1)[0] if "/" in rel else None

          # 1) ملء num المفقود (يُشتقّ من مجلد الصور ch-<num>)
          backfilled = 0
          unresolved = 0
          for mid, mv in manga.items():
              for ch in mv.get("chapters", []):
                  if ch.get("num") is not None:
                      continue
                  num = None
                  for u in (ch.get("images") or []):
                      d = folder_of(u)
                      if d and d.rsplit("/", 1)[-1].startswith("ch-"):
                          num = d.rsplit("/", 1)[-1][3:]
                          break
                  if num:
                      ch["num"] = num
                      backfilled += 1
                  else:
                      unresolved += 1

          # 2) المجلدات اليتيمة = على القرص وغير مذكورة (بالصور أو بالاسم المخمَّن)
          listed = set()
          for mid, mv in manga.items():
              for ch in mv.get("chapters", []):
                  for u in (ch.get("images") or []):
                      d = folder_of(u)
                      if d:
                          listed.add(d)
                  if ch.get("num") is not None:
                      listed.add(f"{mid}/ch-{ch['num']}")
          orphans = sorted(k for k in disk_dirs if k not in listed)

          def page_key(name):
              m = re.search(r"(\d+)\.\w+$", name)
              return (int(m.group(1)) if m else 10**9, name)

          restored = defaultdict(list)
          new_manga = set()
          skipped_no_webp = []
          for key in orphans:
              mid, chdir = key.split("/", 1)
              num = chdir[3:]
              files = sorted(webp.get(key, []), key=page_key)
              if not files:
                  skipped_no_webp.append(key)
                  continue
              if mid not in manga:
                  manga[mid] = {"name": mid.split("__", 1)[-1].replace("-", " "), "chapters": []}
                  new_manga.add(mid)
              chNum = float(num) if re.match(r"^\d+(\.\d+)?$", num) else 0
              manga[mid]["chapters"].append({
                  "label": f"الفصل {num}", "num": num, "chNum": chNum, "sourceUrl": "",
                  "images": [f"{CDN_BASE}/{mid}/{chdir}/{n}" for n in files],
              })
              restored[mid].append((num, len(files)))

          for mv in manga.values():
              mv["chapters"].sort(key=lambda c: (c.get("chNum", 0), str(c.get("num", ""))))

          total = sum(len(v) for v in restored.values())
          changed = bool(total or backfilled)
          L = ["## نتيجة استعادة الفصول اليتيمة" + (" (تجربة — لم يُكتب شيء)" if DRY else ""), ""]
          L.append(f"- فصول مستعادة: **{total}** ضمن {len(restored)} مانهوا (منها {len(new_manga)} مانهوا جديدة بالـmanifest)")
          L.append(f"- حقل num مملوء لفصول قديمة: **{backfilled}**" + (f" (تعذّر ملؤه لـ {unresolved})" if unresolved else ""))
          L.append(f"- مجلدات يتيمة بلا ملفات .webp (تُركت): {len(skipped_no_webp)}")
          L.append("")
          for mid in sorted(restored):
              items = restored[mid]
              L.append(f"- `{mid}` — {len(items)} فصل" + (" (مانهوا جديدة)" if mid in new_manga else ""))
          for k in skipped_no_webp:
              L.append(f"- تُرك بلا .webp: {k}")
          text = "\n".join(L)
          print(text)
          sp = os.environ.get("GITHUB_STEP_SUMMARY")
          if sp:
              with open(sp, "a", encoding="utf-8") as sf:
                  sf.write(text + "\n")

          if changed and not DRY:
              with open(MANIFEST, "w", encoding="utf-8") as f:
                  f.write(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: تنفيذ الاستعادة ودفع manifest.json
        run: |
          set -e
          git config user.name "manhwa-bot"
          git config user.email "bot@users.noreply.github.com"

          python3 "$RUNNER_TEMP/restore.py"
          if [ "$DRY_RUN" = "true" ]; then
            echo "تجربة فقط — لا كتابة ولا دفع"
            exit 0
          fi
          if git diff --quiet -- output/manifest.json; then
            echo "لا تغييرات — لا حاجة لدفع"
            exit 0
          fi

          msg="استعادة فصول يتيمة إلى manifest.json + ملء num المفقود (run ${{ github.run_id }})"
          # manifest.json فقط — لا git add شامل أبدًا (نفس قاعدة compress_chapters/delete-chapters)
          git add --sparse -- output/manifest.json
          git commit -m "$msg"

          success=0
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GIT_BRANCH}"; then
              success=1
              break
            fi
            echo "فشل الدفع #$i — إعادة المزامنة وإعادة تطبيق الاستعادة على أحدث manifest.json..."
            git fetch --depth=1 origin "$GIT_BRANCH"
            git reset --hard "origin/${GIT_BRANCH}"
            python3 "$RUNNER_TEMP/restore.py"
            if git diff --quiet -- output/manifest.json; then
              echo "أصبح manifest.json مطابقًا على origin أصلًا"
              success=1
              break
            fi
            git add --sparse -- output/manifest.json
            git commit -m "$msg"
            sleep $((i * 3))
          done

          if [ "$success" -ne 1 ]; then
            echo "❌ تعذّر الدفع بعد كل المحاولات"
            exit 1
          fi
          echo "✅ تمت الاستعادة"
