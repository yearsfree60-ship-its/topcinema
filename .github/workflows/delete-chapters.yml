name: حذف مانهوات/فصول من المستودع

on:
  workflow_dispatch:
    inputs:
      delete_payload:
        description: >-
          JSON: {"full_manga": ["id1", ...], "chapters": [{"manga_id": "id2", "num": "12"}, ...]}.
          يُولَّد تلقائيًا من صفحة manhwa-saver-github-only.html (شجرة الحذف) — لا يُفترَض تعديله يدويًا.
        required: true
        type: string

permissions:
  contents: write
  # [إضافة] لازمة حصرًا لخطوة حذف تشغيلات GitHub Actions المرتبطة أدناه
  # (DELETE /repos/{owner}/{repo}/actions/runs/{run_id}) — موثَّق رسميًا أن
  # هذه الصلاحية تحديدًا مطلوبة حتى مع github.token الافتراضي لنفس المستودع.
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DELETE_PAYLOAD: ${{ inputs.delete_payload }}
      GIT_BRANCH: output
    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: تجهيز فرع output (git worktree)
        run: |
          set -e
          git config user.name "manhwa-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin --quiet

          if ! git ls-remote --exit-code --heads origin output > /dev/null 2>&1; then
            echo "❌ فرع output غير موجود أصلًا — لا شيء لحذفه"
            exit 1
          fi
          git worktree add output-worktree origin/output
          git -C output-worktree checkout -B output origin/output
          echo "OUTPUT_WORKTREE=$(pwd)/output-worktree" >> "$GITHUB_ENV"

      - name: التحقق من صحة delete_payload
        run: |
          python3 -c "
          import json, os, sys
          try:
              p = json.loads(os.environ['DELETE_PAYLOAD'])
          except Exception as e:
              print(f'❌ delete_payload ليس JSON صالحًا: {e}'); sys.exit(1)
          if not isinstance(p.get('full_manga', []), list) or not isinstance(p.get('chapters', []), list):
              print('❌ بنية delete_payload غير متوقَّعة'); sys.exit(1)
          if not p.get('full_manga') and not p.get('chapters'):
              print('❌ delete_payload فارغ — لا شيء محدد للحذف'); sys.exit(1)
          print(f\"✅ صالح: {len(p.get('full_manga', []))} مانهوا كاملة، {len(p.get('chapters', []))} فصل منفرد\")
          "

      # [تصحيح حرج مُتّبَع من compress_chapters.py] لا "git rm -r output/" ولا
      # "git add -A" أبدًا. كل عملية git تقتصر على قائمة مسارات صريحة
      # محسوبة في delete_manager.py compute-targets — هذا يمنع جذريًا لمس
      # ملفات مانهوات/تشغيلات أخرى غير مقصودة بهذا الطلب.
      - name: حساب المسارات المستهدَفة
        env:
          OUTPUT_DIR: ${{ env.OUTPUT_WORKTREE }}/output
        run: |
          python3 delete_manager.py compute-targets > /tmp/targets.txt
          echo "المسارات المستهدَفة:"
          cat /tmp/targets.txt
          if [ ! -s /tmp/targets.txt ]; then
            echo "⚠️ لا مسارات فعلية على القرص تطابق delete_payload — الأرجح أنها حُذفت مسبقًا"
          fi

      - name: حذف الملفات + تحديث manifest.json + الدفع
        env:
          OUTPUT_DIR: ${{ env.OUTPUT_WORKTREE }}/output
        run: |
          set -e
          cd "$OUTPUT_WORKTREE"
          git_rel_output="output"

          # manifest.json فقط تُضاف بـgit add — تعديل بملف موجود فعلًا.
          # مسارات targets.txt (مجلدات فصول/OCR) لا تُضاف بـgit add إطلاقًا:
          # git rm أدناه يُسجّل حذفها بالفهرس بنفسه، وإعادة تمرير مسار لم
          # يعد موجودًا لا بالقرص ولا بالفهرس لـgit add تفشل بـ"did not
          # match any files" — هذا بالضبط سبب فشل التشغيلة السابقة.
          manifest_path="$git_rel_output/manifest.json"

          apply_and_stage () {
            # يُعاد استدعاؤها بكل محاولة دفع: يسحب أحدث manifest.json من
            # origin مباشرة (لا نسخة محلية قديمة محتملة)، يطبّق الحذف عليها
            # (عملية آمنة التكرار)، يكتبها بالقرص، ثم يحذف مجلدات الفصول/OCR
            # الفعلية (git rm --ignore-unmatch: آمن حتى لو حُذفت مسبقًا
            # بمحاولة سابقة، ويُسجّل حذفها بالفهرس بنفسه)، ثم يضيف تعديل
            # manifest.json حصرًا.
            git show "origin/${GIT_BRANCH}:${git_rel_output}/manifest.json" > /tmp/remote_manifest.json 2>/dev/null || echo '{}' > /tmp/remote_manifest.json
            python3 "$GITHUB_WORKSPACE/delete_manager.py" apply-manifest /tmp/remote_manifest.json "${OUTPUT_DIR}/manifest.json"

            while IFS= read -r t; do
              git rm -r --ignore-unmatch --quiet -- "$git_rel_output/$t" || true
            done < /tmp/targets.txt

            git add -- "$manifest_path"

            # [تصحيح] يشمل الحذف الآن سجلات التشغيلات (output/runs/run-<id>.json)
            # وأي أثر مشابه لها — مقارنة فعلية بالقرص لا بـDELETE_PAYLOAD هذه
            # التشغيلة فقط: أي فصل مذكور بسجلّ لم يعد موجودًا فعليًا كمجلد
            # على القرص (سواء حُذف بهذه التشغيلة بالضبط أعلاه، أو كان سجلّه
            # يتيمًا من قبل) يُزال منه — راجع تبرير كامل بترويسة
            # scrub-run-manifests بـdelete_manager.py. يُستدعى هنا بعد حلقة
            # git rm لمجلدات targets.txt مباشرة (فالقرص عندها يعكس الفصول
            # المتبقية فعليًا)، وداخل apply_and_stage (لا مرة واحدة فقط) كي
            # يعمل دائمًا على أحدث نسخة origin فعليًا بكل محاولة إعادة دفع،
            # بنفس ضمان manifest.json تمامًا.
            while IFS= read -r line; do
              action="${line%% *}"
              rel_path="${line#* }"
              if [ "$action" = "DELETE" ]; then
                git rm --ignore-unmatch --quiet -- "$git_rel_output/$rel_path" || true
                # [إضافة] السجلّ الذي أصبح فارغًا كليًا يعني أن كل فصول
                # تشغيلة الضغط تلك لم يعد لها وجود — نلتقط run_id الحقيقي
                # لمنصة GitHub Actions من اسم الملف نفسه (run-<RUN_ID>.json،
                # وRUN_ID هذا بالضبط هو github.run_id الذي وسم به
                # compress_chapters.py وقت كتابته — لا حاجة لأي مطابقة أو
                # تخمين) لحذف تشغيلة الضغط نفسها من سجلّ Actions بخطوة
                # لاحقة بعد نجاح الدفع. >> لا > عمدًا: قد تُستدعى
                # apply_and_stage أكثر من مرة (إعادة محاولات الدفع)، ونجمع
                # عبر كل المحاولات ثم نُفرّد (sort -u) بالخطوة اللاحقة.
                run_id="${rel_path#runs/run-}"
                run_id="${run_id%.json}"
                case "$run_id" in
                  ''|*[!0-9]*) ;;  # ليس رقمًا صرفًا (اسم ملف غير متوقَّع) — تجاهل بصمت، لا حذف API لاحقًا
                  *) echo "$run_id" >> /tmp/deleted_run_ids.txt ;;
                esac
              elif [ "$action" = "KEEP" ]; then
                git add -- "$git_rel_output/$rel_path"
              fi
            done < <(python3 "$GITHUB_WORKSPACE/delete_manager.py" scrub-run-manifests "$OUTPUT_DIR")
          }

          apply_and_stage
          if git diff --cached --quiet; then
            echo "لا تغييرات (ربما حُذف هذا المحتوى مسبقًا) — لا حاجة لدفع"
            exit 0
          fi
          git commit -m "حذف مانهوات/فصول محدَّدة (run ${{ github.run_id }})"

          success=0
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GIT_BRANCH}"; then
              success=1
              break
            fi
            echo "فشلت محاولة الدفع #$i — إعادة المحاولة بعد إعادة المزامنة مع origin..."
            git fetch origin "$GIT_BRANCH"
            git reset "origin/${GIT_BRANCH}"
            apply_and_stage
            if git diff --cached --quiet; then
              echo "أصبح الحذف مطابقًا لأحدث نسخة على origin أصلًا"
              success=1
              break
            fi
            git commit -m "حذف مانهوات/فصول محدَّدة (run ${{ github.run_id }})"
            sleep $((i * 3))
          done

          if [ "$success" -ne 1 ]; then
            echo "❌ تعذّر الدفع بعد كل المحاولات"
            exit 1
          fi
          echo "✅ تم الحذف والدفع بنجاح"

      # [إضافة] حذف تشغيلات GitHub Actions المرتبطة فعليًا (لا الملف فقط):
      # لكل run-<RUN_ID>.json أصبح فارغًا كليًا (كل فصوله لم يعد لها وجود)،
      # نحذف تشغيلة "ضغط فصول المانهوا" المطابقة بنفس RUN_ID من سجلّ
      # Actions نفسه — راجع بحث فعلي بتوثيق GitHub الرسمي: DELETE
      # /repos/{owner}/{repo}/actions/runs/{run_id} يعمل بـgithub.token
      # الافتراضي لنفس المستودع طالما صلاحية actions: write مُمنوحة أعلاه
      # (لا حاجة لـPAT خارجي). الربط بـRUN_ID مضمون 100% بلا أي تخمين —
      # اسم الملف هو ذات github.run_id الذي وسم به compress_chapters.py
      # وقت كتابته، فلا احتمال لحذف تشغيلة خاطئة من ورشة عمل أخرى.
      #
      # [حذر — لا رجعة فيه] حذف تشغيلة Actions نهائي تمامًا (لا سلة مهملات،
      # موثَّق صراحة). best-effort عمدًا (curl لا يُسقِط -e، ولا exit 1 عند
      # فشل فردي): تشغيلة واحدة قد تكون قيد التنفيذ فعليًا وقتها فتُرفَض
      # الحذف (نادر لتشغيلات قديمة منتهية)، أو مُحذوفة سلفًا (404 — عادي
      # كليًا لو أُعيد تشغيل هذا الـworkflow على نفس delete_payload)؛ كلاهما
      # لا يجب أن يُفشل التشغيلة الحالية بعد نجاح حذف الفصول/المانهوات
      # الفعلي فعليًا بالخطوة السابقة — هذا مجرّد تنظيف إضافي لسجلّ Actions.
      - name: حذف تشغيلات GitHub Actions المرتبطة
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/deleted_run_ids.txt ]; then
            echo "لا تشغيلات Actions مرتبطة أصبحت يتيمة بالكامل — لا شيء يُحذَف"
            exit 0
          fi
          sort -u -o /tmp/deleted_run_ids.txt /tmp/deleted_run_ids.txt
          echo "تشغيلات Actions مرشَّحة للحذف: $(wc -l < /tmp/deleted_run_ids.txt)"

          deleted=0
          skipped=0
          while IFS= read -r run_id; do
            status=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${run_id}")
            case "$status" in
              204)
                echo "  ✅ حُذفت تشغيلة Actions #${run_id}"
                deleted=$((deleted + 1))
                ;;
              404)
                echo "  ⏭️ تشغيلة Actions #${run_id} غير موجودة أصلًا (محذوفة سلفًا على الأرجح)"
                skipped=$((skipped + 1))
                ;;
              *)
                echo "  ⚠️ تعذّر حذف تشغيلة Actions #${run_id} (HTTP ${status}) — تُرِكت كما هي"
                skipped=$((skipped + 1))
                ;;
            esac
          done < /tmp/deleted_run_ids.txt
          echo "ملخّص: حُذف $deleted، تُخُطّي/فشل $skipped"

      # [إضافة] jsDelivr يخزّن نسخة manifest.json مؤقتًا حتى 7 أيام افتراضيًا
      # (توثيق jsDelivr الرسمي: jsdelivr.com/tools/purge) — بدون هذه الخطوة
      # تستمر صفحة العرض بقراءة نسخة قديمة تحوي المحذوف رغم نجاح الحذف
      # والدفع فعليًا بالخطوة أعلاه. best-effort (|| true): فشل التفريغ لا
      # يجب أن يُفشل التشغيلة بعد نجاح الحذف الفعلي.
      - name: تفريغ كاش jsDelivr لـ manifest.json
        if: success()
        run: |
          curl -sf "https://purge.jsdelivr.net/gh/${{ github.repository }}@${GIT_BRANCH}/output/manifest.json" || true
          echo "طُلب تفريغ كاش jsDelivr — قد يحتاج التحديث الكامل عالميًا بضع دقائق"
